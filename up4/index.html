<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificando Dados | TikTok Recompensas</title><meta name="description" content="Verificando seus dados."><style>
:root{--bg:#f6f7f9;--card:#fff;--text:#15171a;--muted:#667085;--border:#e4e7ec;--rose:#e11d48;--green:#059669;--soft-green:#ecfdf5;--soft-rose:#fff1f2;--soft:#f2f4f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.top{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}.wrap{width:100%;max-width:470px;margin:auto;padding:32px 16px}.center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}.card{background:var(--card);padding:26px;border-radius:16px;box-shadow:0 2px 12px rgba(16,24,40,.07);text-align:center}.check{width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#10b981;color:#fff;font-size:34px;font-weight:800}h1{font-size:25px;line-height:1.18;margin:20px 0 0}h2{font-size:17px;margin:26px 0 4px}p{font-size:14px;line-height:1.55;color:var(--muted)}strong{color:var(--text)}.amount-box{margin-top:24px;background:var(--soft-green);padding:20px;border-radius:12px}.label{text-transform:uppercase;font-size:11px;font-weight:800;color:var(--muted)}.amount{font-size:32px;font-weight:900;margin-top:5px}.choice{width:100%;margin-top:12px;padding:16px;border:2px solid var(--border);border-radius:12px;background:#fff;text-align:left;cursor:pointer}.choice.active{border-color:var(--rose)}.choice-title{font-size:16px;font-weight:800}.choice p{margin:5px 0}.price{color:var(--rose);font-size:18px;font-weight:800}.badge{float:right;background:#d1fae5;color:#047857;border-radius:20px;padding:3px 8px;font-size:10px;font-weight:800}.cta{display:block;width:100%;margin-top:20px;border:0;border-radius:11px;padding:16px;background:var(--rose);color:#fff;text-decoration:none;font-size:15px;font-weight:900;text-align:center;cursor:pointer}.cta.green{background:#d1fae5;color:#065f46}.trust{display:flex;justify-content:center;gap:20px;margin-top:20px;font-size:12px;color:var(--muted)}.timer{margin-top:16px;padding:9px;border-radius:8px;background:var(--soft);font-size:13px;text-align:center;color:var(--muted)}.timer b{color:var(--rose)}.fine{text-align:center;font-size:11px;margin-top:18px}.spinner{width:50px;height:50px;margin:auto;border:5px solid #e4e7ec;border-top-color:var(--rose);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.steps{list-style:none;padding:0;margin:24px 0 0;text-align:left}.steps li{padding:8px 0;color:#98a2b3;font-size:14px}.steps li.done{color:var(--text)}.steps li.done:before{content:'✓';color:var(--green);font-weight:900;margin-right:10px}.steps li:not(.done):before{content:'○';margin-right:10px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#fef3c7;color:#b45309;font-size:11px;font-weight:900;text-transform:uppercase}.alert{margin-top:20px;background:var(--soft-rose);color:var(--rose);padding:10px;border-radius:8px;font-size:14px;font-weight:800}.fee{margin-top:22px;padding:16px;background:var(--soft);border-radius:12px}.rows{margin-top:20px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}.row:last-child{border:0}.bonus{color:var(--green);font-weight:800}.benefits{text-align:left;padding:0;list-style:none;margin:20px 0 0}.benefits li{font-size:14px;color:var(--muted);padding:5px 0}@media(max-width:420px){.card{padding:22px 18px}.amount{font-size:29px}.trust{gap:10px;flex-wrap:wrap}}
</style></head><body><main class="center-page"><div style="text-align:center"><div class="spinner"></div><h1 style="font-size:19px">Verificando dados...</h1></div></main><script>setTimeout(()=>location.href='../up5/index.html',3500)</script></body></html>
